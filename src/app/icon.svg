<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    Tab icon: the robot head from the wordmark (RobotHead in
    src/components/wordmark.tsx, native viewBox 0 0 100 170), white with black
    eyes and mouth, on a black rounded square (rx 20 = 20% of the icon) so it
    reads on light and dark tab strips alike.

    The head including its antenna spans y 1–168 (167 units); it is scaled by
    70/167 so it fills 70% of the icon height (y 15–85) and centred on x 50.
    src/app/apple-icon.png (180×180) and src/app/favicon.ico (16/32/48) are
    rendered from this file, so re-render them after any change here.
  -->
  <rect width="100" height="100" rx="20" fill="#000000" />
  <g transform="translate(29.042 14.581) scale(0.41916)">
    <!-- antenna -->
    <circle cx="50" cy="12" r="11" fill="#FFFFFF" />
    <rect x="47" y="20" width="6" height="30" fill="#FFFFFF" />
    <!-- head -->
    <path
      d="M8 88 C8 60 24 44 50 44 C76 44 92 60 92 88 L92 128 C92 152 72 168 50 168 C28 168 8 152 8 128 Z"
      fill="#FFFFFF"
    />
    <!-- eyes and mouth -->
    <circle cx="33" cy="98" r="12" fill="#000000" />
    <circle cx="67" cy="98" r="12" fill="#000000" />
    <rect x="38" y="132" width="24" height="6" rx="3" fill="#000000" />
  </g>
</svg>
